# ---------------------------------------------------------------------------
# Publication records. Rendered by _pages/publications.html.
#
# Fields
#   type      : conference | journal | working | thesis
#               Drives the coloured [C#]/[J#]/[W#]/[T#] tag on the left.
#   date      : "YYYY-MM-DD" string. Sorts the list and picks the year heading.
#   title     : paper title
#   url       : (optional) where the title links to — usually the publisher
#               page. Omit and the title is plain text.
#   id        : (optional) HTML id for the row, so you can link to /publications/#id
#   authors   : list of ids from _data/coauthors.yml, in author order.
#   venue     : short  -> the bold abbreviation, e.g. "EC '24", "SICOMP"
#               full   -> spelled-out name / volume-page details
#               url    -> (optional) link on the abbreviation
#               doi    -> (optional) bare DOI, e.g. 10.1137/24M1708061
#               bibtex -> (optional) BibTeX for THIS version
#               prefix -> (optional) overrides the leading "In ", e.g.
#                         "To appear in " for accepted-but-unpublished papers
#
# BibTeX notes (checked by compiling against plain/alpha/abbrv + biblatex):
#   - For preprints use `howpublished = {arXiv:XXXX.XXXXX [cs.XX]}`. The
#     arXiv-canonical eprint/archivePrefix/primaryClass trio is silently
#     IGNORED by classic .bst styles, which would print a citation with no
#     identifier at all. howpublished renders correctly under both.
#   - Classic .bst styles lowercase titles ("On the computation of ..."), which
#     is normal. If a title contains a proper noun, brace-protect just that
#     word so it survives: title = {{N}ash equilibria in ...}.
#   preliminary : (optional) same shape as `venue`. Printed as an extra
#                 "Preliminary version in ..." line under the main venue.
#                 Independent of whether that conference version is also
#                 listed as its own entry — to list it separately, just add a
#                 normal record with type: conference.
#   links     : ordered list of {label, url} shown on the title row —
#               arXiv, slides, poster, talk, pdf, ...
#               doi and bibtex do NOT go here: they belong to a specific
#               version, so they live inside `venue`/`preliminary` and are
#               rendered on the venue line.
# ---------------------------------------------------------------------------

